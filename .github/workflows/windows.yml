# -----------------------------------------------------------------------------
# Blighter Restrictor - Windows build on GitHub Actions.
# Purpose: on every push (or on demand):
#   windows        - build BlighterRestrictor.exe with PyInstaller and the
#                    BlighterRestrictor-Setup-<ver>.exe installer with Inno
#                    Setup, check the exe starts (--self-test), keep the
#                    installer as a downloadable artifact
#   child-package  - build blighter-child-windows-<ver>.zip (on Linux)
#   child-setup    - build BlighterChild-Setup-<ver>.exe (Inno Setup) from it
#   child-test     - first check that a setup stopped part-way (-TestFailAt 7)
#                    undoes itself; then install another program's Squid and
#                    check the installer refuses to replace it without
#                    /REPLACESQUID and keeps its settings when it does;
#                    install with the Setup.exe (silent) and check it for real (including how long
#                    "status" takes and the neutral block page): Squid, firewall (direct web access blocked,
#                    access through Squid allowed, blocked site refused),
#                    the Opera switch, the SSH rule's addresses, the Brave
#                    and Vivaldi proxy policies,
#                    the parent app's SSH connection code against Windows'
#                    OpenSSH, the self-repair task, pause / resume, a re-run
#                    that replaces Blighter's own Squid (lists and log kept;
#                    "Squid updated" note when the file differs), then
#                    removal through the uninstaller - checking the laptop's settings afterwards
#                    match those recorded before setup.
#
# Copyright (C) 2026 Ways Property
# SPDX-License-Identifier: GPL-3.0-or-later
# This program is free software: you can redistribute it and/or modify it
# under the terms of the GNU General Public License as published by the Free
# Software Foundation, either version 3 of the License, or (at your option)
# any later version.  It is distributed WITHOUT ANY WARRANTY; see the
# LICENSE file or <https://www.gnu.org/licenses/> for details.
# -----------------------------------------------------------------------------
name: Windows build
on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
      - name: Build app and installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File windows\build_windows.ps1
      - name: Self-test the built exe
        shell: pwsh
        run: |
          $dir = Join-Path $env:APPDATA "BlighterRestrictor"
          $p = Start-Process dist\BlighterRestrictor\BlighterRestrictor.exe -ArgumentList "--self-test" -PassThru
          $done = $p.WaitForExit(60000)
          if (Test-Path $dir) { Get-ChildItem $dir; Get-ChildItem $dir -Filter *.log | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName } } else { Write-Host "no settings folder" }
          if (-not $done) { $p.Kill(); throw "exe did not exit" }
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
          Write-Host "Self-test passed"
      - uses: actions/upload-artifact@v4
        with:
          name: BlighterRestrictor-Windows
          path: dist/BlighterRestrictor-Setup-*.exe
          if-no-files-found: error

  child-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows child package
        run: ./build-windows-child.sh
      - uses: actions/upload-artifact@v4
        with:
          name: blighter-child-windows
          path: dist/blighter-child-windows-*.zip
          if-no-files-found: error

  child-setup:
    needs: child-package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: blighter-child-windows
          path: pkg
      - name: Ensure Inno Setup 6.3 or later
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $v = (Get-Item $iscc).VersionInfo.ProductVersion
          Write-Host "Inno Setup $v"
          if ([version]($v -replace '[^0-9.].*$', '') -lt [version]"6.3") { choco upgrade innosetup -y --no-progress }
      - name: Build child installer
        shell: pwsh
        run: |
          $ver = (Select-String -Path parent\blighter_parent\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory dist -Force | Out-Null
          Copy-Item (Get-ChildItem pkg\*.zip).FullName dist\blighter-child-package.zip
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$ver" windows\child-installer.iss
          if ($LASTEXITCODE) { throw "Inno Setup failed" }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: BlighterChild-Windows-Setup
          path: dist/BlighterChild-Setup-*.exe
          if-no-files-found: error

  child-test:
    needs: [child-package, child-setup]
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: blighter-child-windows
          path: pkg
      - uses: actions/download-artifact@v4
        with:
          name: BlighterChild-Windows-Setup
          path: setup
      - name: Prepare test machine
        shell: pwsh
        run: |
          python -m pip install "paramiko>=3.4"
          Expand-Archive (Get-ChildItem pkg\*.zip).FullName -DestinationPath pkg
          $pw = ConvertTo-SecureString "Kid-$(Get-Random)-Aa1!" -AsPlainText -Force
          New-LocalUser -Name testkid -Password $pw | Out-Null
          # Keep the GitHub runner itself online once outgoing traffic is blocked.
          # (Rules in the Blighter group survive enforcement; pause and removal delete them.)
          @'
          $i = 0
          foreach ($p in Get-Process -Name Runner.Listener, Runner.Worker -ErrorAction SilentlyContinue) {
            $i++
            Remove-NetFirewallRule -Name "BR-CI-Runner-$i" -ErrorAction SilentlyContinue
            New-NetFirewallRule -Name "BR-CI-Runner-$i" -DisplayName "CI runner $i" -Group "Blighter Restrictor" `
              -Direction Outbound -Action Allow -Program $p.Path | Out-Null
            Write-Host "Allowed runner program $($p.Path)"
          }
          '@ | Set-Content "$env:RUNNER_TEMP\runner-rules.ps1"
          & "$env:RUNNER_TEMP\runner-rules.ps1"
          # A browser policy that existed before setup - removal must put it back.
          New-Item -Path HKLM:\SOFTWARE\Policies\Google\Chrome -Force | Out-Null
          New-ItemProperty -Path HKLM:\SOFTWARE\Policies\Google\Chrome -Name ProxySettings -Value "PRE-EXISTING" -Force | Out-Null
          # Record the "before" state for the final comparison.
          $before = [ordered]@{
            profiles = @(Get-NetFirewallProfile -PolicyStore PersistentStore | ForEach-Object { "$($_.Name)=$($_.Enabled)/$($_.DefaultOutboundAction)" })
            outbound_allow_on = @(Get-NetFirewallRule -Direction Outbound -Action Allow -Enabled True | Where-Object { $_.Group -ne "Blighter Restrictor" }).Count
            sshd = [bool](Get-Service sshd -ErrorAction SilentlyContinue)
            squid = (Test-Path C:\Squid)
          }
          $before | ConvertTo-Json | Tee-Object "$env:RUNNER_TEMP\before.json"
          # The "after removal matches before setup" check, used twice.
          @'
          $before = Get-Content "$env:RUNNER_TEMP\before.json" -Raw | ConvertFrom-Json
          $bad = @()
          $profiles = @(Get-NetFirewallProfile -PolicyStore PersistentStore | ForEach-Object { "$($_.Name)=$($_.Enabled)/$($_.DefaultOutboundAction)" })
          if (($profiles -join ",") -ne ($before.profiles -join ",")) { $bad += "firewall profiles: $($profiles -join ',') vs $($before.profiles -join ',')" }
          $on = @(Get-NetFirewallRule -Direction Outbound -Action Allow -Enabled True | Where-Object { $_.Group -ne "Blighter Restrictor" }).Count
          if ($on -ne $before.outbound_allow_on) { $bad += "outgoing allow rules on: $on vs $($before.outbound_allow_on)" }
          if (Get-NetFirewallRule -Group "Blighter Restrictor" -ErrorAction SilentlyContinue) { $bad += "Blighter firewall rules left" }
          if (Get-ScheduledTask -TaskPath "\Blighter Restrictor\" -ErrorAction SilentlyContinue) { $bad += "scheduled tasks left" }
          if (Get-LocalUser blighter -ErrorAction SilentlyContinue) { $bad += "blighter account left" }
          $sshd = Get-Service sshd -ErrorAction SilentlyContinue
          if (-not $before.sshd -and $sshd -and ($sshd.Status -eq "Running" -or "$($sshd.StartType)" -ne "Disabled")) { $bad += "sshd still running/enabled: $($sshd.Status) $($sshd.StartType)" }
          if (-not $before.sshd -and (Get-NetFirewallRule -Name OpenSSH-Server-In-TCP -ErrorAction SilentlyContinue | Where-Object Enabled -eq "True")) { $bad += "OpenSSH firewall rule left on" }
          if (-not $before.squid -and (Test-Path C:\Squid\bin\squid.exe)) { $bad += "Squid still installed" }
          $v = (Get-ItemProperty HKLM:\SOFTWARE\Policies\Google\Chrome -ErrorAction SilentlyContinue).ProxySettings
          if ($v -ne "PRE-EXISTING") { $bad += "Chrome policy not restored ($v)" }
          if (Get-ItemProperty HKLM:\SOFTWARE\Policies\Microsoft\Edge -Name ProxySettings -ErrorAction SilentlyContinue) { $bad += "Edge policy left" }
          if (Test-Path HKLM:\SOFTWARE\Policies\Mozilla\Firefox\Proxy) { $bad += "Firefox policy left" }
          if (Test-Path C:\ProgramData\BlighterChild) { $bad += "C:\ProgramData\BlighterChild left" }
          Invoke-WebRequest https://example.com -NoProxy -TimeoutSec 30 | Out-Null
          Write-Host "OK: direct web access works again after removal"
          if ($bad) { $bad | ForEach-Object { Write-Host "NOT RESTORED: $_" }; throw "$($bad.Count) difference(s) after removal" }
          Write-Host "OK: laptop settings match the state recorded before setup"
          '@ | Set-Content "$env:RUNNER_TEMP\compare.ps1"
          "BLIGHTER_ADMIN_PASSWORD=Parent-$(Get-Random)-Aa1!" | Out-File -Append $env:GITHUB_ENV
      - name: Interrupted setup is undone
        shell: pwsh
        run: |
          # Stop setup with an error at step 7 (after Squid, the account and
          # OpenSSH): it must undo everything by itself.
          $dir = (Get-ChildItem pkg -Directory | Select-Object -First 1).FullName
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$dir\blighter-setup.ps1" -Child testkid -Yes -TestFailAt 7
          if ($LASTEXITCODE -eq 0) { throw "setup should have failed at step 7" }
          Start-Sleep -Seconds 15
          & "$env:RUNNER_TEMP\compare.ps1"
          Write-Host "OK: interrupted setup undone"
          & "$env:RUNNER_TEMP\runner-rules.ps1"
          $global:LASTEXITCODE = 0
      - name: Another program's Squid is not replaced without permission
        shell: pwsh
        run: |
          # Install Diladele's Squid directly, as "another program" would.
          Invoke-WebRequest https://www.diladele.com/pkg/squid/7.8/squid-7.8_amd64.msi -OutFile "$env:RUNNER_TEMP\other.msi" -UseBasicParsing
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$env:RUNNER_TEMP\other.msi`" /qn /norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "other Squid install failed ($($p.ExitCode))" }
          Add-Content C:\Squid\etc\squid\squid.conf "`n# OTHER-PROGRAM-CONFIG"
          $b = Get-Content "$env:RUNNER_TEMP\before.json" -Raw | ConvertFrom-Json
          $b.squid = $true
          $b | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP\before.json"
          $dir = (Get-ChildItem pkg -Directory | Select-Object -First 1).FullName
          $q = powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$dir\blighter-setup.ps1" -Query
          $q | Write-Host
          if (-not ($q -match "^squid`tother$")) { throw "Query did not report another program's Squid" }
          if (-not ($q -match "^account`ttestkid`t")) { throw "Query did not list testkid" }
          $exe = (Get-ChildItem setup\BlighterChild-Setup-*.exe).FullName
          $p = Start-Process $exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CHILD=testkid /LOG=`"$env:RUNNER_TEMP\inno-refuse.log`"" -Wait -PassThru
          Write-Host "Setup exit code without /REPLACESQUID: $($p.ExitCode)"
          Get-Content "$env:TEMP\Blighter-Child-Setup.log" -ErrorAction SilentlyContinue | Select-Object -Last 15
          if ($p.ExitCode -eq 0) { throw "setup should have refused to replace another program's Squid" }
          if (Test-Path C:\ProgramData\BlighterChild\state\pre-install.json) { throw "setup changed the laptop although it refused" }
          if (-not (Select-String C:\Squid\etc\squid\squid.conf -Pattern "OTHER-PROGRAM-CONFIG" -Quiet)) { throw "other program's squid.conf was changed" }
          Write-Host "OK: another program's Squid left alone"
          $global:LASTEXITCODE = 0
      - name: Install the child component with the Setup.exe
        shell: pwsh
        run: |
          $exe = (Get-ChildItem setup\BlighterChild-Setup-*.exe).FullName
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process $exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CHILD=testkid /REPLACESQUID /LOG=`"$env:RUNNER_TEMP\inno.log`"" -Wait -PassThru
          Write-Host ("Setup took {0:n0} seconds, exit code {1}" -f $sw.Elapsed.TotalSeconds, $p.ExitCode)
          Get-Content "$env:TEMP\Blighter-Child-Setup.log"
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\inno.log" | Select-Object -Last 40; throw "Setup.exe failed ($($p.ExitCode))" }
          if (-not (Select-String "$env:TEMP\Blighter-Child-Setup.log" -Pattern "##BLIGHTER done" -Quiet)) { throw "setup did not report done" }
          if (Test-Path C:\ProgramData\BlighterChild\state\setup-incomplete.txt) { throw "setup-incomplete marker left after a finished setup" }
          if (-not (Select-String C:\ProgramData\BlighterChild\backup\squid-before-blighter\etc-squid\squid.conf -Pattern "OTHER-PROGRAM-CONFIG" -Quiet)) { throw "other program's Squid settings not saved" }
          $pre = @(Get-ChildItem C:\Squid\etc\squid -Filter "squid.conf.pre-blighter-*")
          if ($pre.Count -ne 1 -or -not (Select-String $pre[0].FullName -Pattern "OTHER-PROGRAM-CONFIG" -Quiet)) { throw "pre-blighter backup is not the other program's squid.conf ($($pre.Name -join ','))" }
          if (Get-NetFirewallRule -DisplayName "Squid Cache Server" -ErrorAction SilentlyContinue) { throw "Squid's port 3128 firewall rule left" }
          foreach ($f in "$env:PUBLIC\Desktop\Squid Terminal.lnk", "$env:PUBLIC\Desktop\Squid Server Tray.lnk") { if (Test-Path $f) { throw "shortcut left: $f" } }
          $sha = (Get-Content C:\ProgramData\BlighterChild\state\squid-msi.sha256).Trim()
          if ($sha -ne "a2ba4fde87e7deacab84c13fab20dcc1fb0e226b72fee81612f7cb66022d8cc3") { throw "recorded Squid hash $sha" }
          if (Select-String "$env:TEMP\Blighter-Child-Setup.log" -Pattern "##BLIGHTER squid-updated" -Quiet) { throw "tested Squid reported as updated" }
          $u = Get-ChildItem HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall | Get-ItemProperty | Where-Object { $_.DisplayName -like "Blighter Child*" }
          if (-not $u) { throw "no entry in Settings > Apps" }
          Write-Host "Settings > Apps: $($u.DisplayName) $($u.DisplayVersion)"
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Blighter Child\Pause filtering (parent).lnk")) { throw "Pause shortcut missing" }
          if (-not (Test-Path "${env:ProgramFiles}\Blighter Child\THIRD-PARTY-NOTICES.txt")) { throw "notices not installed" }
          icacls C:\Squid; icacls C:\ProgramData\BlighterChild; icacls C:\ProgramData\BlighterChild\python\python.exe
          Write-Host "OK: installed with the Setup.exe"
      - name: Check filtering
        shell: pwsh
        run: |
          $h = "C:\ProgramData\BlighterChild\blighter-apply.cmd"
          $n = @(Get-NetFirewallRule).Count
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $st = & $h status | ConvertFrom-Json
          $secs = $sw.Elapsed.TotalSeconds
          Write-Host ("status took {0:n1} seconds ({1} firewall rules on this machine)" -f $secs, $n)
          if ($secs -gt 30) { throw "status is too slow ($secs s)" }
          $st | Format-List | Out-String | Write-Host
          Write-Host $st.firewall_rules
          if ($st.platform -ne "windows") { throw "platform" }
          if (-not $st.squid_running) { throw "Squid not running" }
          if (-not $st.firewall_active) { throw "firewall not active" }
          if (-not $st.proxy_locked) { throw "proxy policies missing" }
          foreach ($k in "HKLM:\SOFTWARE\Policies\BraveSoftware\Brave", "HKLM:\SOFTWARE\Policies\Vivaldi") {
            $v = (Get-ItemProperty -Path $k -Name ProxySettings -ErrorAction SilentlyContinue).ProxySettings
            if ($v -notmatch "127\.0\.0\.1:3128") { throw "ProxySettings policy missing under $k ($v)" }
          }
          Write-Host "OK: Brave and Vivaldi proxy policies set"
          if ($st.child_is_admin -ne $false) { throw "child_is_admin should be false" }
          $direct = $true
          try { Invoke-WebRequest https://example.com -NoProxy -TimeoutSec 15 | Out-Null } catch { $direct = $false }
          if ($direct) { throw "Direct web access was NOT blocked" }
          Write-Host "OK: direct web access blocked"
          $r = Invoke-WebRequest https://example.com -Proxy http://127.0.0.1:3128 -TimeoutSec 30
          Write-Host "OK: through Squid -> HTTP $($r.StatusCode)"
          '{"mode":"allow-all-block-some","allow":[],"block":[".example.com"]}' | & $h set
          if ($LASTEXITCODE) { throw "set failed" }
          $blocked = $true
          try { Invoke-WebRequest https://www.example.com -Proxy http://127.0.0.1:3128 -TimeoutSec 30 | Out-Null; $blocked = $false } catch { }
          if (-not $blocked) { throw "Blocked site was reachable" }
          Write-Host "OK: blocked site refused by Squid"
          $log = & $h log 20
          $log | Write-Host
          if (-not ($log -match "TCP_DENIED")) { throw "No TCP_DENIED entry in the Squid log" }
          # The block page must not mention Squid (plain http shows Squid's page).
          $page = (& curl.exe -s -i -x http://127.0.0.1:3128 http://www.example.com/) -join "`n"
          Write-Host $page
          if ($page -notmatch "This site isn't available") { throw "neutral block page not shown" }
          if ($page -match "(?i)squid|X-Cache|Via:") { throw "block page or headers still mention Squid" }
          Write-Host "OK: neutral block page, no Squid headers"
          # Discord switch: blocked -> Discord refused by Squid and no voice rule;
          # allowed again -> voice rule back.
          $r = '{"mode":"allow-all-block-some","allow":[],"block":[".example.com"],"discord":false}' | & $h set | ConvertFrom-Json
          Write-Host "set discord=false: $($r.message)"
          if (-not $r.ok -or $r.discord) { throw "Discord switch off failed" }
          if (Get-NetFirewallRule -Name BR-Voice -ErrorAction SilentlyContinue) { throw "BR-Voice still present with Discord blocked" }
          $d = (& curl.exe -s -o NUL -w "%{http_code}" -x http://127.0.0.1:3128 http://discord.com/)
          Write-Host "discord.com with Discord blocked -> $d"
          if ($d -ne "403") { throw "Discord not blocked (got $d)" }
          if (((& $h get) | ConvertFrom-Json).discord) { throw "get still reports Discord allowed" }
          $r = '{"mode":"allow-all-block-some","allow":[],"block":[".example.com"],"discord":true}' | & $h set | ConvertFrom-Json
          Write-Host "set discord=true: $($r.message)"
          if (-not $r.ok -or -not $r.discord) { throw "Discord switch on failed" }
          if (-not (Get-NetFirewallRule -Name BR-Voice -ErrorAction SilentlyContinue)) { throw "BR-Voice missing with Discord allowed" }
          $d = (& curl.exe -s -o NUL -w "%{http_code}" -x http://127.0.0.1:3128 http://discord.com/)
          Write-Host "discord.com with Discord allowed -> $d"
          if ($d -eq "403" -or $d -eq "000") { throw "Discord still blocked (got $d)" }
          Write-Host "OK: Discord switch blocks and allows"
          # Opera switch: on by default -> opera.com refused; off -> allowed; back on.
          if (-not ((& $h get) | ConvertFrom-Json).opera) { throw "Opera downloads should be blocked by default" }
          $d = (& curl.exe -s -o NUL -w "%{http_code}" -x http://127.0.0.1:3128 http://www.opera.com/)
          Write-Host "opera.com with Opera blocked -> $d"
          if ($d -ne "403") { throw "Opera not blocked (got $d)" }
          $r = '{"mode":"allow-all-block-some","allow":[],"block":[".example.com"],"opera":false}' | & $h set | ConvertFrom-Json
          Write-Host "set opera=false: $($r.message)"
          if (-not $r.ok -or $r.opera) { throw "Opera switch off failed" }
          $d = (& curl.exe -s -o NUL -w "%{http_code}" -x http://127.0.0.1:3128 http://www.opera.com/)
          Write-Host "opera.com with Opera allowed -> $d"
          if ($d -eq "403" -or $d -eq "000") { throw "Opera still blocked (got $d)" }
          $r = '{"mode":"allow-all-block-some","allow":[],"block":[".example.com"],"opera":true}' | & $h set | ConvertFrom-Json
          if (-not $r.ok -or -not $r.opera) { throw "Opera switch on failed" }
          Write-Host "OK: Opera switch blocks and allows"
          # Home network: detected at setup (the runner's private network), then
          # switched off, then set to another subnet.
          $ni = & $h netinfo
          Write-Host "netinfo: $ni"
          $g = (& $h get) | ConvertFrom-Json
          Write-Host ("home_net after setup: " + ($g.home_net | ConvertTo-Json -Compress))
          if ($g.home_net.subnets.Count -and -not (Get-NetFirewallRule -Name BR-HomeNet -ErrorAction SilentlyContinue)) { throw "BR-HomeNet missing after setup" }
          $r = '{"mode":"allow-all-block-some","allow":[],"block":[".example.com"],"home_net":{"allowed":false,"subnets":["192.168.77.0/24"]}}' | & $h set | ConvertFrom-Json
          Write-Host "home off: $($r.message)"
          if (-not $r.ok -or $r.home_net.allowed) { throw "home network off failed" }
          if (Get-NetFirewallRule -Name BR-HomeNet -ErrorAction SilentlyContinue) { throw "BR-HomeNet still present when off" }
          # The SSH rule keeps the recorded home subnet even with the switch off.
          $s = (Get-NetFirewallRule -Name BR-SSH-In | Get-NetFirewallAddressFilter).RemoteAddress -join ","
          Write-Host "BR-SSH-In remote addresses (home off): $s"
          if ($s -notmatch "LocalSubnet" -or $s -notmatch "192\.168\.77\.0") { throw "BR-SSH-In addresses wrong with home off: $s" }
          $r = '{"mode":"allow-all-block-some","allow":[],"block":[".example.com"],"home_net":{"allowed":true,"subnets":["192.168.77.0/24","10.200.0.0/16"],"name":"CI net"}}' | & $h set | ConvertFrom-Json
          Write-Host "home on: $($r.message)"
          $a = (Get-NetFirewallRule -Name BR-HomeNet | Get-NetFirewallAddressFilter).RemoteAddress -join ","
          Write-Host "BR-HomeNet remote addresses: $a"
          if ($a -notmatch "192\.168\.77\.0" -or $a -notmatch "10\.200\.0\.0") { throw "BR-HomeNet addresses wrong: $a" }
          $s = (Get-NetFirewallRule -Name BR-SSH-In | Get-NetFirewallAddressFilter).RemoteAddress -join ","
          Write-Host "BR-SSH-In remote addresses (home on): $s"
          if ($s -notmatch "LocalSubnet" -or $s -notmatch "10\.200\.0\.0") { throw "BR-SSH-In addresses wrong: $s" }
          $r = '{"mode":"allow-all-block-some","allow":[],"block":[".example.com"],"home_net":{"allowed":true,"subnets":["not-a-net"]}}' | & $h set | ConvertFrom-Json
          if ($r.ok) { throw "invalid home subnet was accepted" }
          $st2 = & $h status | ConvertFrom-Json
          if (-not $st2.firewall_active) { throw "firewall not active after home network changes: $($st2.firewall_rules)" }
          if ($st2.firewall_rules -notmatch "BR-HomeNet") { throw "status does not list BR-HomeNet" }
          Write-Host "OK: home network switch and subnets"
          $global:LASTEXITCODE = 0
          if (@(Get-ChildItem C:\Squid\etc\squid\blighter\errors -Filter ERR_*).Count -lt 40) { throw "error pages missing" }
          Get-ChildItem C:\Squid\usr\share\squid\errors -Directory -ErrorAction SilentlyContinue | Select-Object -First 5 | ForEach-Object { Write-Host "stock errors folder: $($_.Name)" }
      - name: Parent app SSH code against Windows OpenSSH
        shell: pwsh
        run: |
          @"
          import sys, tempfile
          sys.path.insert(0, 'parent')
          from blighter_parent.remote import Remote
          class C: ip='127.0.0.1'; port=22; admin_user='blighter'; name='CI'; child_user='testkid'
          r = Remote(C(), sys.argv[1], tempfile.mktemp())
          import time
          t = time.monotonic(); r._connect(); print('first SSH login: %.1f s' % (time.monotonic() - t))
          t = time.monotonic(); cfg = r.get(); print('get over SSH: %.1f s' % (time.monotonic() - t))
          r2 = Remote(C(), sys.argv[1], tempfile.mktemp())
          t = time.monotonic(); r2._connect(); print('second SSH login: %.1f s' % (time.monotonic() - t))
          t = time.monotonic(); r2.get(); print('get on the second connection: %.1f s' % (time.monotonic() - t))
          t = time.monotonic(); r2.get(); print('get again on it: %.1f s' % (time.monotonic() - t)); r2.close()
          t = time.monotonic(); st = r.status(); print('status over SSH: %.1f s' % (time.monotonic() - t))
          print('windows detected:', r.windows, '| squid running:', st['squid_running'], '| firewall:', st['firewall_active'])
          assert r.windows and st['platform'] == 'windows' and st['firewall_active']
          res = r.apply('block-all-allow-some', ['.example.com'], [])
          print('apply:', res)
          assert res['ok']
          print(r.log(5))
          r.close()
          "@ | Set-Content ci_ssh.py
          python ci_ssh.py $env:BLIGHTER_ADMIN_PASSWORD
          if ($LASTEXITCODE) { throw "SSH test failed" }
      - name: Self-repair task
        shell: pwsh
        run: |
          Set-NetFirewallProfile -Profile Domain, Private, Public -DefaultOutboundAction Allow
          Start-ScheduledTask -TaskPath "\Blighter Restrictor\" -TaskName "Enforce"
          Start-Sleep -Seconds 45
          Get-Content C:\ProgramData\BlighterChild\state\enforce.log -Tail 10
          $p = Get-NetFirewallProfile -Profile Public
          if ($p.DefaultOutboundAction -ne "Block") { throw "Enforce task did not repair the firewall" }
          Write-Host "OK: firewall repaired by the scheduled task"
      - name: Pause and resume
        shell: pwsh
        run: |
          # As the parent app does it: the helper's pause / resume commands.
          $h = "C:\ProgramData\BlighterChild\blighter-apply.cmd"
          $r = & $h pause | ConvertFrom-Json
          Write-Host "pause: $($r.message)"
          if (-not $r.ok -or -not $r.paused) { throw "pause failed: $($r.errors)" }
          & "$env:RUNNER_TEMP\runner-rules.ps1"
          Invoke-WebRequest https://example.com -NoProxy -TimeoutSec 30 | Out-Null
          Write-Host "OK: paused - direct web access works"
          $v = (Get-ItemProperty HKLM:\SOFTWARE\Policies\Google\Chrome).ProxySettings
          if ($v -ne "PRE-EXISTING") { throw "pause did not restore the earlier Chrome policy ($v)" }
          $st = & C:\ProgramData\BlighterChild\blighter-apply.cmd status | ConvertFrom-Json
          if (-not $st.paused -or $st.firewall_active) { throw "status should report paused" }
          if ((Get-ScheduledTask -TaskPath "\Blighter Restrictor\" -TaskName Enforce).State -ne "Disabled") { throw "Enforce task not disabled" }
          Write-Host "OK: paused state reported; Enforce task disabled"
          $r = & $h resume | ConvertFrom-Json
          Write-Host "resume: $($r.message)"
          if (-not $r.ok -or $r.paused) { throw "resume failed: $($r.errors)" }
          $direct = $true
          try { Invoke-WebRequest https://example.com -NoProxy -TimeoutSec 15 | Out-Null } catch { $direct = $false }
          if ($direct) { throw "resume did not block direct access" }
          $st = & C:\ProgramData\BlighterChild\blighter-apply.cmd status | ConvertFrom-Json
          if ($st.paused -or -not $st.firewall_active) { throw "status after resume" }
          Write-Host "OK: resumed - direct web access blocked again"
      - name: Re-run replaces Blighter's own Squid and keeps the lists
        shell: pwsh
        run: |
          $h = "C:\ProgramData\BlighterChild\blighter-apply.cmd"
          $r = '{"mode":"allow-all-block-some","allow":[],"block":[".keepme-ci.example"]}' | & $h set | ConvertFrom-Json
          if (-not $r.ok) { throw "set failed: $($r.message)" }
          $logLines = @(Get-Content C:\Squid\var\log\squid\access.log -ErrorAction SilentlyContinue).Count
          Write-Host "access.log lines before: $logLines"
          # Force a reinstall, and pretend the download differs from the tested file.
          Remove-Item C:\ProgramData\BlighterChild\state\squid-msi.sha256 -Force
          $env:BLIGHTER_TEST_SQUID_SHA = "0" * 64
          $exe = (Get-ChildItem setup\BlighterChild-Setup-*.exe).FullName
          Remove-Item "$env:TEMP\Blighter-Child-Setup.log" -ErrorAction SilentlyContinue
          $p = Start-Process $exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CHILD=testkid /KEEPPASSWORD /LOG=`"$env:RUNNER_TEMP\inno2.log`"" -Wait -PassThru
          Remove-Item Env:\BLIGHTER_TEST_SQUID_SHA
          Get-Content "$env:TEMP\Blighter-Child-Setup.log"
          if ($p.ExitCode -ne 0) { throw "re-run failed ($($p.ExitCode))" }
          if (-not (Select-String "$env:TEMP\Blighter-Child-Setup.log" -Pattern "Old Squid uninstalled" -Quiet)) { throw "Squid was not replaced" }
          if (-not (Select-String "$env:TEMP\Blighter-Child-Setup.log" -Pattern "##BLIGHTER squid-updated" -Quiet)) { throw "changed Squid not reported" }
          $g = (& $h get) | ConvertFrom-Json
          if (-not ($g.block -contains ".keepme-ci.example")) { throw "block list not kept: $($g.block -join ',')" }
          $after = @(Get-Content C:\Squid\var\log\squid\access.log -ErrorAction SilentlyContinue).Count
          Write-Host "access.log lines after: $after"
          if ($after -lt $logLines) { throw "activity log not kept" }
          if (Test-Path C:\ProgramData\BlighterChild\backup\squid-blighter) { throw "temporary backup not deleted" }
          $st = & $h status | ConvertFrom-Json
          if (-not $st.squid_running -or -not $st.firewall_active) { throw "not filtering after the re-run" }
          python ci_ssh.py $env:BLIGHTER_ADMIN_PASSWORD
          if ($LASTEXITCODE) { throw "SSH with the kept password failed" }
          Write-Host "OK: Blighter's Squid replaced, lists and log kept, password kept, update note shown"
      - name: Remove with the uninstaller and compare with the state before setup
        if: always()
        shell: pwsh
        run: |
          $u = Get-ChildItem HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall | Get-ItemProperty | Where-Object { $_.DisplayName -like "Blighter Child*" }
          if ($u) {
            $un = ($u.UninstallString -replace '"', '')
            Start-Process $un -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait
          } else {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\ProgramData\BlighterChild\blighter-setup.ps1 -Remove -Yes
          }
          Start-Sleep -Seconds 15
          if (Get-ChildItem HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall | Get-ItemProperty | Where-Object { $_.DisplayName -like "Blighter Child*" }) { throw "Settings > Apps entry left" }
          if (Test-Path "${env:ProgramFiles}\Blighter Child") { throw "Program Files\Blighter Child left" }
          if (-not (Select-String C:\Squid\etc\squid\squid.conf -Pattern "OTHER-PROGRAM-CONFIG" -Quiet)) { throw "other program's squid.conf not put back" }
          if (-not (Test-Path C:\ProgramData\Squid-settings-before-Blighter)) { throw "saved Squid settings not kept" }
          Write-Host "OK: other program's Squid configuration put back"
          & "$env:RUNNER_TEMP\compare.ps1"
