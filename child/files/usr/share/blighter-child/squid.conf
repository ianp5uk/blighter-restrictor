# -----------------------------------------------------------------------------
# Blighter Restrictor - managed squid.conf for a child's PC.
#
# Purpose: a minimal forward proxy that listens only on this PC
# (127.0.0.1:3128), filters by domain name (HTTP and HTTPS via CONNECT, no
# decryption / no SSL-bump), and logs every request to
# /var/log/squid/access.log for the parent app to view.
# The per-child allow/block rules live in /etc/squid/blighter/ and are
# written by /usr/sbin/blighter-apply.  The previous squid.conf was saved
# by blighter-setup as /etc/squid/squid.conf.pre-blighter-<date>.
#
# Copyright (C) 2026 Ian Packer
# SPDX-License-Identifier: GPL-3.0-or-later
# This program is free software: you can redistribute it and/or modify it
# under the terms of the GNU General Public License as published by the Free
# Software Foundation, either version 3 of the License, or (at your option)
# any later version.  It is distributed WITHOUT ANY WARRANTY; see the
# LICENSE file or <https://www.gnu.org/licenses/> for details.
# -----------------------------------------------------------------------------

# Only this PC may use the proxy.
http_port 127.0.0.1:3128

# Only web ports.
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT
# Discord voice: its voice servers (*.discord.media) take secure connections
# on port 2053.  Only that port, only for .discord.media, only via CONNECT;
# whether Discord is allowed at all is still decided by the "Allow Discord"
# switch in rules.conf (blocked = denied there, on every port).
acl blighter_voice_port port 2053
acl blighter_voice_host dstdomain .discord.media

http_access deny !Safe_ports !blighter_voice_port
http_access deny CONNECT !SSL_ports !blighter_voice_port
http_access deny blighter_voice_port !CONNECT
http_access deny blighter_voice_port !blighter_voice_host
http_access deny manager
# Stop the proxy being used to reach services on this PC or the router.
http_access deny to_localhost
http_access deny to_linklocal

# Per-child rules (mode, allow list, block list).
include /etc/squid/blighter/rules.conf

http_access deny all

# No caching needed - this is a filter, not a cache.
cache deny all

# Do not reveal the PC's address to web sites.
forwarded_for delete

access_log daemon:/var/log/squid/access.log squid
# Logs are rotated by logrotate on Ubuntu.
logfile_rotate 0
coredump_dir /var/spool/squid
