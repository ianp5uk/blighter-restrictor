# -----------------------------------------------------------------------------
# Blighter Restrictor - managed squid.conf for a child's WINDOWS laptop.
#
# Purpose: the same minimal domain filter as the Ubuntu version, adapted to
# "Squid for Windows" from Diladele B.V. (a Cygwin build).  It listens only
# on this laptop (127.0.0.1:3128), filters by domain name (HTTP and HTTPS via
# CONNECT, no decryption / no SSL-bump) and logs every request for the
# parent app to view.
#
# Paths below are Cygwin paths: "/" is the Squid install folder, normally
# C:\Squid, so /etc/squid/blighter = C:\Squid\etc\squid\blighter and
# /var/log/squid = C:\Squid\var\log\squid.
# The per-child allow/block rules live in /etc/squid/blighter/ and are
# written by blighter-apply.py.  The previous squid.conf was saved by
# blighter-setup.ps1 as squid.conf.pre-blighter-<date>.
#
# Copyright (C) 2026 Ways Property
# SPDX-License-Identifier: GPL-3.0-or-later
# This program is free software: you can redistribute it and/or modify it
# under the terms of the GNU General Public License as published by the Free
# Software Foundation, either version 3 of the License, or (at your option)
# any later version.  It is distributed WITHOUT ANY WARRANTY; see the
# LICENSE file or <https://www.gnu.org/licenses/> for details.
# -----------------------------------------------------------------------------

# Only this laptop may use the proxy.
http_port 127.0.0.1:3128

# Only web ports.
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny manager
# Stop the proxy being used to reach services on this laptop or the router.
http_access deny to_localhost
http_access deny to_linklocal

# Per-child rules (mode, allow list, block list).
include /etc/squid/blighter/rules.conf

http_access deny all

# No caching needed - this is a filter, not a cache.
cache deny all

# Do not reveal the laptop's address to web sites.
forwarded_for delete

# Squid for Windows cannot read Windows' own DNS settings, so it needs
# explicit DNS servers.  This file is written by blighter-setup.ps1
# (default: 1.1.1.1 and 8.8.8.8; change with -DnsServers).
include /etc/squid/blighter/dns.conf

# The Windows build's log daemon is unreliable, so write the log directly.
access_log stdio:/var/log/squid/access.log squid
# Keep 14 old logs (access.log.0 = newest).  A daily scheduled task runs
# "squid -k rotate".
logfile_rotate 14
coredump_dir /var/cache/squid
max_filedescriptors 3200
